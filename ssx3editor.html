<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSX 3 Save Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-alt: #eef3f1;
      --ink: #1d2329;
      --muted: #65717d;
      --line: #d9e0e5;
      --line-strong: #b8c3cc;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --warn: #9a5b00;
      --warn-bg: #fff3d8;
      --bad: #a33131;
      --bad-bg: #ffe7e7;
      --good: #146c43;
      --good-bg: #e4f5ec;
      --code-bg: #101418;
      --code-ink: #e9eef2;
      --shadow: 0 1px 2px rgba(29, 35, 41, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    button.primary:hover:not(:disabled) {
      color: var(--accent-ink);
      filter: brightness(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    input[type="text"] {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 7px 10px;
    }

    input[type="text"]:focus {
      outline: 2px solid rgba(15, 118, 110, 0.22);
      border-color: var(--accent);
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand .sub {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .file-input {
      display: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
    }

    .side,
    .main {
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel + .panel {
      margin-top: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfc;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #3f4a54;
    }

    .panel-body {
      padding: 14px;
    }

    .dropzone {
      display: grid;
      align-items: center;
      min-height: 148px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--ink);
      padding: 16px;
      cursor: pointer;
    }

    .dropzone:hover,
    .dropzone.dragging {
      border-color: var(--accent);
      background: #e6f2ef;
    }

    .drop-title {
      margin: 0 0 8px;
      font-weight: 760;
      font-size: 15px;
    }

    .drop-meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 680;
      color: #384650;
      background: #f7f9fa;
      white-space: nowrap;
    }

    .badge.good {
      border-color: #b8dfca;
      color: var(--good);
      background: var(--good-bg);
    }

    .badge.warn {
      border-color: #efcd8c;
      color: var(--warn);
      background: var(--warn-bg);
    }

    .badge.bad {
      border-color: #efb0b0;
      color: var(--bad);
      background: var(--bad-bg);
    }

    .summary-list {
      display: grid;
      grid-template-columns: minmax(94px, auto) minmax(0, 1fr);
      gap: 9px 12px;
      margin: 0;
      font-size: 13px;
    }

    .summary-list dt {
      margin: 0;
      color: var(--muted);
    }

    .summary-list dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 620;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      padding: 8px;
    }

    .tab {
      border-color: transparent;
      background: transparent;
      min-height: 34px;
      padding: 0 12px;
      color: var(--muted);
    }

    .tab.active {
      border-color: var(--line-strong);
      background: var(--surface-alt);
      color: var(--ink);
    }

    .tab-content {
      display: none;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .editor-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.2;
      color: var(--ink);
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field label,
    .field .label {
      font-size: 12px;
      font-weight: 760;
      color: #3f4a54;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field-value {
      min-height: 38px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafb;
      padding: 7px 10px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .note.warn {
      color: var(--warn);
    }

    .note.bad {
      color: var(--bad);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .stats-table input[type="text"] {
      width: 76px;
      min-width: 64px;
      min-height: 32px;
      padding: 5px 7px;
      font-variant-numeric: tabular-nums;
    }

    .event-table input[type="text"] {
      width: 110px;
      min-width: 96px;
      min-height: 32px;
      padding: 5px 7px;
      font-variant-numeric: tabular-nums;
    }

    .event-table .candidate td {
      background: #fffaf0;
    }

    .stats-table .current-row td {
      background: #f1f7f4;
    }

    .collectible-table td {
      white-space: normal;
    }

    .collectible-count {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 6px;
      min-width: 260px;
      max-width: 640px;
    }

    .slot-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfc;
      color: var(--ink);
      padding: 4px 6px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .slot-toggle:has(input:checked) {
      border-color: #b8dfca;
      background: var(--good-bg);
      color: var(--good);
    }

    .slot-toggle input {
      margin: 0;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      background: #f8fafb;
      color: #3f4a54;
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.mono,
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    pre {
      margin: 0;
      max-height: 560px;
      overflow: auto;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-ink);
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      tab-size: 2;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 230px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfc;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    .changed {
      margin-top: 14px;
    }

    .footer-status {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    @media (max-width: 880px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>SSX 3 Save Editor</h1>
        <span class="sub" id="loadedName">No file loaded</span>
      </div>
      <div class="actions">
        <button type="button" id="chooseFile">Choose File</button>
        <button type="button" id="downloadOriginal" disabled>Download Unchanged</button>
        <button type="button" id="downloadCore" disabled>Download Core</button>
        <button type="button" id="downloadEditedCore" disabled>Download Edited Core</button>
        <button type="button" id="downloadEdited" class="primary" disabled>Download Edited</button>
        <button type="button" id="resetEdits" disabled>Reset Edits</button>
      </div>
      <input class="file-input" id="fileInput" type="file" accept=".ssx,.gci,.xps,.max,.cbs,application/octet-stream">
    </header>

    <main class="workspace">
      <aside class="side">
        <section class="panel">
          <div class="panel-body">
            <div class="dropzone" id="dropzone" role="button" tabindex="0">
              <div>
                <p class="drop-title">Drop save file</p>
                <p class="drop-meta">Xbox Data.ssx, GameCube .gci, PS2 XPort .xps, Max Drive .max, CodeBreaker .cbs</p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Status</h2>
          </div>
          <div class="panel-body" id="statusPanel">
            <div class="status-row">
              <span class="badge">Waiting</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>File Summary</h2>
          </div>
          <div class="panel-body" id="summaryPanel">
            <div class="empty">No save file selected.</div>
          </div>
        </section>
      </aside>

      <section class="main panel">
        <nav class="tabs" aria-label="Save sections">
          <button type="button" class="tab active" data-tab="editor">Editor</button>
          <button type="button" class="tab" data-tab="diagnostics">Diagnostics</button>
          <button type="button" class="tab" data-tab="technical">Technical</button>
        </nav>

        <section class="tab-content active" id="tab-editor">
          <div class="empty">No parsed save data.</div>
        </section>

        <section class="tab-content" id="tab-diagnostics">
          <div class="empty">No diagnostics available.</div>
        </section>

        <section class="tab-content" id="tab-technical">
          <pre>{}</pre>
        </section>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      const CONSTANTS = Object.freeze({
        CORE_SIZE: 0x9b61,
        XBOX_SIGNATURE_SIZE: 20,
        XBOX_TOTAL_SIZE: 0x9b61 + 20,
        GC_HEADER_SIZE: 0x40,
        GC_FILE_DATA_SIZE: 0x10000,
        GC_CORE_FILE_OFFSET: 0x4844,
        XPORT_RECORD_SIZE: 0xfa,
        PROFILE_FIELD_LEN: 12,
        PROFILE_NAME_MAX: 11,
        GC_COMMENT_LINE_LEN: 32,
        GC_COMMENT_MAX: 31,
        GC_MONEY_OFFSET: 0x3968,
        GC_TOTAL_MONEY_OFFSET: 0x396c,
        CORE_TAIL_RIDER_OFFSET: 0x9b5c,
        CORE_TAIL_VALUE_OFFSET: 0x9b5d,
        CORE_CHECKSUM_POLY: 0xa001,
        CORE_CHECKSUM_XOR: 0x0185,
        GC_COLLECTIBLE_TABLE_OFFSET: 0x2ea8,
        GC_COLLECTIBLE_ENTRY_SIZE: 0x0c,
        GC_COLLECTIBLE_ENTRY_COUNT: 23,
        GC_COLLECTIBLE_MASK_OFFSET: 4,
        GC_COLLECTIBLE_MASK_LENGTH: 8,
        GC_EVENT_RECORD_TABLE_OFFSET: 0x0ad8,
        GC_EVENT_RECORD_SIZE: 0x08,
        GC_EVENT_STATUS_OFFSET: 4,
        GC_EVENT_TIME_MAX_SECONDS: 999999,
        RIDER_STAT_ROW_OFFSET: 0x0beb,
        RIDER_STAT_VALUE_SCALE: 5,
        RIDER_STAT_MAX_RAW: 55,
        RIDER_SLOT_MARKER_OFFSET: 0x0beb,
        RIDER_SLOT_STRIDE: 0x0f88,
        RIDER_SLOT_COUNT: 10
      });

      const GAME_DATA_ID_RE = /^B[AE]SL[UE]S-\d{5}-GAM\d{4}$/;
      const RIDER_STAT_FIELDS = Object.freeze([
        { id: "acceleration", label: "Acceleration", byteIndex: 1 },
        { id: "edging", label: "Edging", byteIndex: 3 },
        { id: "speed", label: "Speed", byteIndex: 0 },
        { id: "spin", label: "Spin", byteIndex: 4 },
        { id: "stability", label: "Stability", byteIndex: 6 },
        { id: "toughness", label: "Toughness", byteIndex: 5 },
        { id: "tricks", label: "Tricks", byteIndex: 2 }
      ]);

      const GC_COLLECTIBLE_AREAS = Object.freeze([
        { id: "snowJam", peak: "Peak 1", label: "Snow Jam", entryIndex: 0, total: 30 },
        { id: "metroCity", peak: "Peak 1", label: "Metro City", entryIndex: 1, total: 35 },
        { id: "ruthlessRidge", peak: "Peak 2", label: "Ruthless Ridge", entryIndex: 2, total: 30 },
        { id: "intimidator", peak: "Peak 2", label: "Intimidator", entryIndex: 3, total: 25 },
        { id: "rnb", peak: "Peak 1", label: "R&B", entryIndex: 5, total: 30 },
        { id: "crowsNest", peak: "Peak 1", label: "Crow's Nest", entryIndex: 8, total: 2 },
        { id: "theJunction", peak: "Peak 1", label: "The Junction", entryIndex: 11, total: 4 },
        { id: "happiness", peak: "Peak 1", label: "Happiness", entryIndex: 14, total: 44 },
        { id: "ruthless", peak: "Peak 2", label: "Ruthless", entryIndex: 15, total: 44 },
        { id: "greenStation", peak: "Peak 1", label: "Green Station", entryIndex: 17, total: 5 },
        { id: "blueStation", peak: "Peak 1", label: "Blue Station", entryIndex: 18, total: 5 },
        { id: "redStation", peak: "Peak 2", label: "Red Station", entryIndex: 20, total: 5 }
      ]);

      const GC_EVENT_RECORDS = Object.freeze([
        { id: "peak1Race", peak: "Peak 1", category: "Race", label: "Peak I Race", type: "time", recordIndex: 1, confidence: "confirmed" },
        { id: "peak2Race", peak: "Peak 2", category: "Race", label: "Peak II Race", type: "time", recordIndex: 2, confidence: "confirmed" },
        { id: "peak1Jam", peak: "Peak 1", category: "Freestyle", label: "Peak I Jam", type: "score", recordIndex: 4, confidence: "confirmed" },
        { id: "snowJam", peak: "Peak 1", category: "Race", label: "Snow Jam", type: "time", recordIndex: 7, confidence: "candidate" },
        { id: "happinessJam", peak: "Peak 1", category: "Freestyle", label: "Happiness Jam", type: "score", recordIndex: 8, confidence: "confirmed" },
        { id: "ruthless", peak: "Peak 2", category: "Race", label: "Ruthless", type: "time", recordIndex: 9, confidence: "candidate" },
        { id: "intimidator", peak: "Peak 2", category: "Race", label: "Intimidator", type: "time", recordIndex: 13, confidence: "confirmed" },
        { id: "metroCity", peak: "Peak 1", category: "Race", label: "Metro City", type: "time", recordIndex: 14, confidence: "confirmed" },
        { id: "ruthlessRidge", peak: "Peak 2", category: "Race", label: "Ruthless Ridge", type: "time", recordIndex: 15, confidence: "confirmed" },
        { id: "happiness", peak: "Peak 1", category: "Race", label: "Happiness", type: "time", recordIndex: 16, confidence: "candidate" },
        { id: "rnb", peak: "Peak 1", category: "Freestyle", label: "R&B", type: "score", recordIndex: 18, confidence: "confirmed" },
        { id: "crowsNest", peak: "Peak 1", category: "Freestyle", label: "Crow's Nest", type: "score", recordIndex: 21, confidence: "candidate" },
        { id: "theJunction", peak: "Peak 1", category: "Freestyle", label: "The Junction", type: "score", recordIndex: 24, confidence: "confirmed" }
      ]);

      const FIELD_REGISTRY = Object.freeze([
        {
          id: "profileName",
          label: "Profile Name",
          coreOffset: 0,
          length: CONSTANTS.PROFILE_FIELD_LEN,
          maxLength: CONSTANTS.PROFILE_NAME_MAX,
          codec: "ascii-z"
        },
        {
          id: "currentRiderId",
          label: "Current Rider ID",
          coreOffset: CONSTANTS.CORE_TAIL_RIDER_OFFSET,
          length: 1,
          min: 0,
          max: 255,
          codec: "u8-candidate"
        },
        {
          id: "gameCubeMoney",
          label: "Money",
          coreOffset: CONSTANTS.GC_MONEY_OFFSET,
          length: 4,
          min: 0,
          max: 4294967295,
          codec: "u32be",
          platform: "GameCube"
        },
        {
          id: "gameCubeTotalMoney",
          label: "Total Money Earned",
          coreOffset: CONSTANTS.GC_TOTAL_MONEY_OFFSET,
          length: 4,
          min: 0,
          max: 4294967295,
          codec: "u32be",
          platform: "GameCube"
        },
        {
          id: "gameCubeCommentLine1",
          label: "GameCube Comment Line 1",
          absoluteOffset: CONSTANTS.GC_HEADER_SIZE,
          length: CONSTANTS.GC_COMMENT_LINE_LEN,
          maxLength: CONSTANTS.GC_COMMENT_MAX,
          codec: "ascii-z",
          wrapperOnly: true
        },
        {
          id: "gameCubeCommentLine2",
          label: "GameCube Comment Line 2",
          absoluteOffset: CONSTANTS.GC_HEADER_SIZE + 0x20,
          length: CONSTANTS.GC_COMMENT_LINE_LEN,
          maxLength: CONSTANTS.GC_COMMENT_MAX,
          codec: "ascii-z",
          wrapperOnly: true
        }
      ]);

      function byteAt(bytes, offset) {
        return offset >= 0 && offset < bytes.length ? bytes[offset] : 0;
      }

      function u16le(bytes, offset) {
        return byteAt(bytes, offset) | (byteAt(bytes, offset + 1) << 8);
      }

      function u16be(bytes, offset) {
        return (byteAt(bytes, offset) << 8) | byteAt(bytes, offset + 1);
      }

      function u32le(bytes, offset) {
        return (byteAt(bytes, offset) |
          (byteAt(bytes, offset + 1) << 8) |
          (byteAt(bytes, offset + 2) << 16) |
          (byteAt(bytes, offset + 3) * 0x1000000)) >>> 0;
      }

      function u32be(bytes, offset) {
        return ((byteAt(bytes, offset) * 0x1000000) |
          (byteAt(bytes, offset + 1) << 16) |
          (byteAt(bytes, offset + 2) << 8) |
          byteAt(bytes, offset + 3)) >>> 0;
      }

      function writeU32le(bytes, offset, value) {
        const v = Number(value) >>> 0;
        bytes[offset] = v & 0xff;
        bytes[offset + 1] = (v >>> 8) & 0xff;
        bytes[offset + 2] = (v >>> 16) & 0xff;
        bytes[offset + 3] = (v >>> 24) & 0xff;
      }

      function writeU32be(bytes, offset, value) {
        const v = Number(value) >>> 0;
        bytes[offset] = (v >>> 24) & 0xff;
        bytes[offset + 1] = (v >>> 16) & 0xff;
        bytes[offset + 2] = (v >>> 8) & 0xff;
        bytes[offset + 3] = v & 0xff;
      }

      function xportChecksum(bytes, start, end) {
        let checksum = 0;
        for (let offset = start; offset < end; offset += 1) {
          checksum = (checksum + ((byteAt(bytes, offset) << (checksum % 24)) >>> 0)) >>> 0;
        }
        return checksum >>> 0;
      }

      function ssxCoreChecksum(coreBytes) {
        let checksum = 0;
        for (let offset = 0; offset < CONSTANTS.CORE_TAIL_VALUE_OFFSET; offset += 1) {
          checksum = (checksum ^ byteAt(coreBytes, offset)) & 0xffff;
          for (let bit = 0; bit < 8; bit += 1) {
            if ((checksum & 1) !== 0) {

      function writeCoreChecksum(coreBytes, valueEndian) {

        if (valueEndian === "big") {

        } else {
          writeU32le(coreBytes, CONSTANTS.CORE_TAIL_VALUE_OFFSET, checksum);
        }
        return checksum;

      function copyBytes(bytes) {
        return new Uint8Array(bytes);
      }

      function asciiFixed(bytes, offset, length) {
        let value = "";
        const end = Math.min(bytes.length, offset + length);

        let value = "";
        const end = Math.min(bytes.length, offset + maxLength);

          if (b === 0) {

          }

        if (length < bytes.length) {

      function parseIntegerDraft(value) {
        const text = String(value == null ? "" : value).trim();
        if (text === "") {

        if (/^0x[0-9a-f]+$/i.test(text)) {

        return container && container.core ? byteAt(container.core.bytes, CONSTANTS.CORE_TAIL_RIDER_OFFSET) : 0;

      function readCoreTailValue(container) {
        return container && container.core ? readCoreEndianValue(container.core, CONSTANTS.CORE_TAIL_VALUE_OFFSET) : 0;

        return Boolean(container && container.kind === "gamecube-gci" && container.core);

      function readGameCubeMoney(container) {

      }

      function readGameCubeTotalMoney(container) {
        return supportsGameCubeGameplayFields(container) ? u32be(container.core.bytes, CONSTANTS.GC_TOTAL_MONEY_OFFSET) : 0;

      function riderStatRowOffset(index) {
        return CONSTANTS.RIDER_STAT_ROW_OFFSET + (index * CONSTANTS.RIDER_SLOT_STRIDE);

        RIDER_STAT_FIELDS.forEach((field) => {

        const rows = [];
        for (let index = 0; index < CONSTANTS.RIDER_SLOT_COUNT; index += 1) {

        return Array.from({ length: CONSTANTS.RIDER_SLOT_COUNT }, () => {
          const row = {};
          RIDER_STAT_FIELDS.forEach((field) => {
            row[field.id] = "";
          });
          return row;
        });

      function gameCubeStatsDraft(container) {
        if (!supportsGameCubeGameplayFields(container)) {

        return readAllRiderStats(container).map((stats) => {
          const row = {};
          RIDER_STAT_FIELDS.forEach((field) => {

          });

        });

      function collectibleEntryOffset(area) {
        return CONSTANTS.GC_COLLECTIBLE_TABLE_OFFSET + (area.entryIndex * CONSTANTS.GC_COLLECTIBLE_ENTRY_SIZE);

      function collectibleSlotByteBit(slotIndex) {
        const wordIndex = slotIndex < 32 ? 0 : 1;

      function readCollectibleMaskBytes(container, area) {

        if (!supportsGameCubeGameplayFields(container)) {

        const start = collectibleEntryOffset(area) + CONSTANTS.GC_COLLECTIBLE_MASK_OFFSET;

        const start = collectibleEntryOffset(area) + CONSTANTS.GC_COLLECTIBLE_MASK_OFFSET;

        const maskBytes = readCollectibleMaskBytes(container, area);

          peak: area.peak,
          label: area.label,
          entryIndex: area.entryIndex,
          total: area.total,
          offset,
          absoluteOffset: container && container.core ? container.core.offset + offset : offset,
          count: supportsGameCubeGameplayFields(container) ? u32le(container.core.bytes, offset) : 0,
          slotCount: slots.filter(Boolean).length,

      function readRawCollectibleEntries(container) {
        const entries = [];
        if (!supportsGameCubeGameplayFields(container)) {
          return entries;

        for (let index = 0; index < CONSTANTS.GC_COLLECTIBLE_ENTRY_COUNT; index += 1) {
          const offset = CONSTANTS.GC_COLLECTIBLE_TABLE_OFFSET + (index * CONSTANTS.GC_COLLECTIBLE_ENTRY_SIZE);
          const mask = container.core.bytes.slice(
            offset + CONSTANTS.GC_COLLECTIBLE_MASK_OFFSET,
            offset + CONSTANTS.GC_COLLECTIBLE_MASK_OFFSET + CONSTANTS.GC_COLLECTIBLE_MASK_LENGTH
          );

          entries.push({
            index,
            name: namedArea ? namedArea.label : null,
            peak: namedArea ? namedArea.peak : null,
            offset,
            absoluteOffset: container.core.offset + offset,
            count: u32le(container.core.bytes, offset),
            maskPopcount: countMaskBits(mask),
            maskHex: bytesToHex(mask, CONSTANTS.GC_COLLECTIBLE_MASK_LENGTH)
          });
        }
        return entries;
      }

      function emptyGameCubeCollectiblesDraft() {
        const draft = {};
        GC_COLLECTIBLE_AREAS.forEach((area) => {
          draft[area.id] = Array.from({ length: area.total }, () => false);
        });
        return draft;
      }

      function gameCubeCollectiblesDraft(container) {
        if (!supportsGameCubeGameplayFields(container)) {
          return emptyGameCubeCollectiblesDraft();
        }
        const draft = {};
        GC_COLLECTIBLE_AREAS.forEach((area) => {
          draft[area.id] = readCollectibleArea(container, area).slots.slice();
        });
        return draft;
      }

      function countCheckedSlots(slots) {

          }
        }

      }

      function normalizeCollectibleSlots(slots, total) {

      }

      function writeCollectibleArea(coreBytes, area, slots) {

        for (let slotIndex = 0; slotIndex < normalized.length; slotIndex += 1) {

      function currentGameCubeEventRiderIndex(container) {
        const riderIndex = readCoreRiderId(container);

      function eventRecordOffset(riderIndex, eventRecord) {
        return CONSTANTS.GC_EVENT_RECORD_TABLE_OFFSET +

          (eventRecord.recordIndex * CONSTANTS.GC_EVENT_RECORD_SIZE);

      function formatTimeSeconds(totalSeconds) {
        const value = Math.max(0, Number(totalSeconds) || 0);

        const seconds = value % 60;

      }

      function parseTimeDraft(value) {
        const text = String(value == null ? "" : value).trim();

          const parts = text.split(":");
          const minutes = Number.parseInt(parts[0], 10);
          const seconds = Number.parseInt(parts[1], 10);

          }
          return (minutes * 60) + seconds;

      }

      function parseGameCubeEventValueDraft(eventRecord, value) {
        return eventRecord.type === "time" ? parseTimeDraft(value) : parseIntegerDraft(value);

      function formatGameCubeEventValue(eventRecord, value) {

        const offset = eventRecordOffset(riderIndex, eventRecord);
        const value = supportsGameCubeGameplayFields(container) ? u32be(container.core.bytes, offset) : 0;
        return {
          id: eventRecord.id,
          peak: eventRecord.peak,
          category: eventRecord.category,
          label: eventRecord.label,
          type: eventRecord.type,
          confidence: eventRecord.confidence,
          recordIndex: eventRecord.recordIndex,
          riderIndex,
          offset,
          absoluteOffset: container && container.core ? container.core.offset + offset : offset,
          value,
          displayValue: formatGameCubeEventValue(eventRecord, value),
          statusHex: supportsGameCubeGameplayFields(container)

      function readAllGameCubeEventRecords(container, riderIndex) {

      function emptyGameCubeEventsDraft() {
        const draft = {};
        GC_EVENT_RECORDS.forEach((eventRecord) => {
          draft[eventRecord.id] = "";
        });
        return draft;
      }

      function gameCubeEventsDraft(container, riderIndex) {
        if (!supportsGameCubeGameplayFields(container)) {
          return emptyGameCubeEventsDraft();
        }
        const draft = {};
        const index = Number.isInteger(riderIndex) ? riderIndex : currentGameCubeEventRiderIndex(container);
        GC_EVENT_RECORDS.forEach((eventRecord) => {
          const record = readGameCubeEventRecord(container, index, eventRecord);
          draft[eventRecord.id] = record.displayValue;

        return draft;
      }

      function writeGameCubeEventRecord(coreBytes, riderIndex, eventRecord, value) {
        const offset = eventRecordOffset(riderIndex, eventRecord);
        writeU32be(coreBytes, offset, value);
      }

      function parseStatRawDraft(value) {
        const text = String(value == null ? "" : value).trim();
        if (!/^\d+(\.\d+)?$/.test(text)) {
          return NaN;
        }
        const number = Number(text);
        if (!Number.isFinite(number)) {
          return NaN;
        }
        const raw = Math.round(number * CONSTANTS.RIDER_STAT_VALUE_SCALE);
        if (raw < 0 || raw > CONSTANTS.RIDER_STAT_MAX_RAW) {
          return NaN;
        }
        if (Math.abs((raw / CONSTANTS.RIDER_STAT_VALUE_SCALE) - number) > 0.000001) {
          return NaN;
        }
        return raw;
      }

      function countNonZero(bytes) {
        let count = 0;
        for (let i = 0; i < bytes.length; i += 1) {

          }
        }
        return count;
      }

      function findAsciiAll(bytes, text) {
        const needle = [];
        for (let i = 0; i < text.length; i += 1) {
          needle.push(text.charCodeAt(i));
        }
        const positions = [];
        for (let i = 0; i <= bytes.length - needle.length; i += 1) {
          let matched = true;
          for (let j = 0; j < needle.length; j += 1) {
            if (bytes[i + j] !== needle[j]) {

              break;
            }
          }
          if (matched) {
            positions.push(i);
          }

      }

      }

          output[i + 1] = byteAt(bytes, i);

        return output;
      }

        const end = Math.min(bytes.length, limit || bytes.length);
        let start = -1;
        let value = "";
        for (let i = 0; i < end; i += 1) {
          const b = bytes[i];
          if (b >= 32 && b <= 126) {
            if (start === -1) {
              start = i;
            }
            value += String.fromCharCode(b);
          } else {
            if (value.length >= minLength) {
              results.push({ offset: start, value });
            }
            start = -1;
            value = "";
          }
        }
        if (value.length >= minLength) {
          results.push({ offset: start, value });
        }

      }

      function regionFromGameId(gameId) {
        if (!gameId) {
          return "Unknown";
        }
        if (gameId.includes("SLUS")) {
          return "North America";
        }
        if (gameId.includes("SLES")) {
          return "Europe/PAL";
        }
        return "Unknown";
      }

      function regionFromGameCubeCode(code) {
        if (!code || code.length < 4) {
          return "Unknown";
        }
        if (code[3] === "E") {
          return "North America";
        }
        if (code[3] === "P") {
          return "Europe/PAL";
        }
        return "Unknown";
      }

      function extensionFromName(fileName) {
        const match = /\.([^.\\\/]+)$/.exec(fileName || "");

      function baseName(fileName) {
        return (fileName || "save").replace(/\.[^.]*$/, "");

      function addFileSuffix(fileName, suffix) {
        const name = fileName || "save.bin";

        return name.slice(0, dot) + suffix + name.slice(dot);

      function containerBase(kind, label, bytes, fileName) {
        return {
          kind,
          label,
          fileName: fileName || "",
          originalBytes: copyBytes(bytes),
          fileSize: bytes.length,
          platform: "Unknown",
          region: "Unknown",
          titleId: "",
          saveTitle: "",
          profileName: "",
          support: "metadata",
          canEditFields: false,
          canExportEdited: false,
          exportBlocker: "Edited export is not available for this format yet.",
          core: null,
          wrapper: {},
          records: [],
          warnings: []
        };

      function parseXbox(bytes, fileName) {

        container.support = "core";
        container.canEditFields = true;
        container.exportBlocker = "Xbox saves include a 20-byte signature trailer. Edited export is disabled until signing is implemented.";
        container.core = {
          offset: 0,
          length: CONSTANTS.CORE_SIZE,
          bytes: bytes.slice(0, CONSTANTS.CORE_SIZE),
          byteOrder: "little-endian core fields",
          valueEndian: "little"

          coreOffset: 0,
          coreLength: CONSTANTS.CORE_SIZE,
          signatureOffset: CONSTANTS.CORE_SIZE,
          signatureLength: CONSTANTS.XBOX_SIGNATURE_SIZE,
          signatureHex: bytesToHex(bytes.slice(CONSTANTS.CORE_SIZE), CONSTANTS.XBOX_SIGNATURE_SIZE),

      }

      function parseRawCore(bytes, fileName) {
        const container = containerBase("raw-core", "Raw SSX 3 core payload", bytes, fileName);
        container.platform = "Unknown";
        container.support = "core";
        container.canEditFields = true;
        container.exportBlocker = "Raw core saves still need the internal integrity bytes to be mapped before edited export is enabled.";
        container.core = {
          offset: 0,
          length: CONSTANTS.CORE_SIZE,
          bytes: bytes.slice(0, CONSTANTS.CORE_SIZE),
          byteOrder: "little-endian core fields",
          valueEndian: "little"
        };
        container.profileName = asciiZ(container.core.bytes, 0, CONSTANTS.PROFILE_FIELD_LEN);
        container.wrapper = {
          coreOffset: 0,
          coreLength: CONSTANTS.CORE_SIZE
        };
        return container;
      }

      function looksLikeGci(bytes) {
        if (bytes.length < CONSTANTS.GC_HEADER_SIZE + CONSTANTS.GC_CORE_FILE_OFFSET + CONSTANTS.CORE_SIZE) {

        const gameCode = asciiFixed(bytes, 0, 4);
        const maker = asciiFixed(bytes, 4, 2);
        const internalName = asciiZ(bytes, 8, 32);
        return /^GXB[A-Z0-9]$/.test(gameCode) && maker === "69" && /\.ssx$/i.test(internalName);
      }

      function parseGameCubeGci(bytes, fileName) {
        const container = containerBase("gamecube-gci", "GameCube GCI", bytes, fileName);
        const gameCode = asciiFixed(bytes, 0, 4);
        const maker = asciiFixed(bytes, 4, 2);
        const internalName = asciiZ(bytes, 8, 32);
        const coreOffset = CONSTANTS.GC_HEADER_SIZE + CONSTANTS.GC_CORE_FILE_OFFSET;

        const commentLine2 = asciiZ(bytes, CONSTANTS.GC_HEADER_SIZE + 0x20, CONSTANTS.GC_COMMENT_LINE_LEN);

        container.canExportMetadataEdited = true;

          offset: coreOffset,
          fileDataOffset: CONSTANTS.GC_CORE_FILE_OFFSET,
          length: CONSTANTS.CORE_SIZE,
          bytes: coreBytes,
          byteOrder: "mixed: ASCII plus GameCube-specific field codecs",
          valueEndian: "big",
          integrity: {
            algorithm: "CRC-16 reflected poly 0xa001, init 0x0000, xor 0x0185, range 0x0000..0x9b5c",
            stored: storedChecksum,
            calculated: calculatedChecksum,
            ok: storedChecksum === calculatedChecksum

        container.wrapper = {
          gciHeaderLength: CONSTANTS.GC_HEADER_SIZE,
          gameCode,
          maker,
          internalName,
          commentLine1,
          commentLine2,
          commentLine1Offset: CONSTANTS.GC_HEADER_SIZE,
          commentLine2Offset: CONSTANTS.GC_HEADER_SIZE + 0x20,
          fileDataLength: bytes.length - CONSTANTS.GC_HEADER_SIZE,
          coreOffset,
          coreFileDataOffset: CONSTANTS.GC_CORE_FILE_OFFSET,
          preCoreIntegrityOffset: coreOffset - 4,
          preCoreIntegrityHex: bytesToHex(bytes.slice(coreOffset - 4, coreOffset), 4),

        };

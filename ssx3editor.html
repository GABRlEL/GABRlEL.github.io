      }

      function parseXportRecords(bytes) {
        const records = [];
        for (let offset = 0; offset + CONSTANTS.XPORT_RECORD_SIZE <= bytes.length; offset += 1) {
          if (u16le(bytes, offset) !== CONSTANTS.XPORT_RECORD_SIZE) {
            continue;
          }
          const name = asciiZ(bytes, offset + 2, 64);
          if (!/^[A-Za-z0-9_.-]{3,64}$/.test(name)) {
            continue;
          }
          const size = u32le(bytes, offset + 0x42);
          const dataOffset = offset + CONSTANTS.XPORT_RECORD_SIZE;
          const plausibleSize = size <= bytes.length && (dataOffset + size <= bytes.length || size < 16);
          if (!plausibleSize) {
            continue;
          }
          records.push({
            offset,
            recordLength: CONSTANTS.XPORT_RECORD_SIZE,
            name,
            size,
            dataOffset,
            dataEnd: dataOffset + size,
            modeOrType: u32le(bytes, offset + 0x5e)
          });
        }
        return records;
      }

      function parseXport(bytes, fileName) {
        const container = containerBase("ps2-xport", "PS2 XPort/SharkPort", bytes, fileName);
        const strings = printableStrings(bytes, 4, 0x400);
        const records = parseXportRecords(bytes);
        const coreRecord = records.find((record) => GAME_DATA_ID_RE.test(record.name) && record.size === CONSTANTS.CORE_SIZE) || null;
        const rootRecord = records.find((record) => GAME_DATA_ID_RE.test(record.name)) || null;
        const titleString = strings.find((item) => item.value.startsWith("SSX 3"));
        const payloadStart = records.length ? Math.min.apply(null, records.map((record) => record.offset)) : null;
        const checksumOffset = bytes.length >= 4 ? bytes.length - 4 : null;
        const storedChecksum = checksumOffset !== null ? u32le(bytes, checksumOffset) : null;
        const calculatedChecksum = payloadStart !== null && checksumOffset !== null && checksumOffset > payloadStart
          ? xportChecksum(bytes, payloadStart, checksumOffset)
          : null;
        container.platform = "PlayStation 2";
        container.titleId = coreRecord ? coreRecord.name : rootRecord ? rootRecord.name : "";
        container.region = regionFromGameId(container.titleId);
        container.saveTitle = titleString ? titleString.value : "";
        container.records = records;
        container.wrapper = {
          magic: asciiZ(bytes, 4, 32),
          recordsFound: records.length,
          strings: strings.slice(0, 12),
          coreRecordOffset: coreRecord ? coreRecord.offset : null,
          coreDataOffset: coreRecord ? coreRecord.dataOffset : null,
          coreDataEnd: coreRecord ? coreRecord.dataEnd : null,
          trailingBytesAfterCore: coreRecord ? Math.max(0, bytes.length - coreRecord.dataEnd) : null,
          trailingHexAfterCore: coreRecord ? bytesToHex(bytes.slice(coreRecord.dataEnd, Math.min(bytes.length, coreRecord.dataEnd + 16)), 16) : "",
          checksum: {
            payloadStart,
            checksumOffset,
            declaredPayloadLength: payloadStart !== null && payloadStart >= 4 ? u32le(bytes, payloadStart - 4) : null,
            stored: storedChecksum,
            calculated: calculatedChecksum,
            ok: storedChecksum !== null && calculatedChecksum !== null && storedChecksum === calculatedChecksum
          }
        };
        if (coreRecord) {
          container.support = "core";
          container.canEditFields = true;
          container.exportBlocker = "PS2 XPort wrapper checksum is mapped, but SSX 3 core integrity bytes are not mapped yet. Edited export is disabled.";
          container.core = {
            offset: coreRecord.dataOffset,
            length: CONSTANTS.CORE_SIZE,
            bytes: bytes.slice(coreRecord.dataOffset, coreRecord.dataEnd),
            byteOrder: "little-endian core fields",
            valueEndian: "little"
          };
          container.profileName = asciiZ(container.core.bytes, 0, CONSTANTS.PROFILE_FIELD_LEN);
        } else {
          container.support = "metadata";
          container.exportBlocker = "No embedded SSX 3 game data record of size 0x9b61 was found.";
          container.warnings.push("XPort wrapper detected without a supported SSX 3 data record.");
        }
        return container;
      }

      function parseMaxDrive(bytes, fileName) {
        const container = containerBase("ps2-maxdrive", "PS2 Max Drive", bytes, fileName);
        const gameId = asciiZ(bytes, 0x10, 32);
        container.platform = "PlayStation 2";
        container.titleId = gameId;
        container.region = regionFromGameId(gameId);
        container.saveTitle = asciiZ(bytes, 0x30, 32);
        container.support = "metadata";
        container.exportBlocker = "Max Drive payload decoding and re-encoding are deferred.";
        container.wrapper = {
          magic: asciiZ(bytes, 0, 12),
          headerChecksumOrId: bytesToHex(bytes.slice(0x0c, 0x10), 4),
          gameId,
          saveTitle: container.saveTitle,
          valueAt0x50LE: u32le(bytes, 0x50),
          fileCountAt0x54LE: u32le(bytes, 0x54),
          uncompressedLengthAt0x58LE: u32le(bytes, 0x58),
          payloadOffset: 0x5c,
          payloadPreviewHex: bytesToHex(bytes.slice(0x5c, 0x7c), 32)
        };
        return container;
      }

      function parseCodeBreaker(bytes, fileName) {
        const container = containerBase("ps2-codebreaker", "PS2 CodeBreaker", bytes, fileName);
        const gameId = asciiZ(bytes, 0x14, 32);
        container.platform = "PlayStation 2";
        container.titleId = gameId;
        container.region = regionFromGameId(gameId);
        container.saveTitle = asciiZ(bytes, 0x5c, 32);
        container.support = "metadata";
        container.exportBlocker = "CodeBreaker payload decoding and re-encoding are deferred.";
        container.wrapper = {
          magic: asciiFixed(bytes, 0, 4),
          valueAt0x04LE: u32le(bytes, 0x04),
          headerLengthAt0x08LE: u32le(bytes, 0x08),
          uncompressedLengthAt0x0cLE: u32le(bytes, 0x0c),
          storedFileLengthAt0x10LE: u32le(bytes, 0x10),
          gameId,
          saveTitle: container.saveTitle,
          payloadOffset: 0x128,
          payloadPreviewHex: bytesToHex(bytes.slice(0x128, 0x148), 32)
        };
        return container;
      }

      function parseUnknown(bytes, fileName) {
        const container = containerBase("unknown", "Unknown file", bytes, fileName);
        container.exportBlocker = "This file does not match a supported SSX 3 save wrapper.";
        container.wrapper = {
          extension: extensionFromName(fileName),
          first64Hex: bytesToHex(bytes.slice(0, 64), 64),
          strings: printableStrings(bytes, 4, 512).slice(0, 10)
        };
        return container;
      }

      function detectContainer(bytes, fileName) {
        if (!(bytes instanceof Uint8Array)) {
          bytes = new Uint8Array(bytes);
        }
        if (hasAscii(bytes, 0, "Ps2PowerSave")) {
          return parseMaxDrive(bytes, fileName);
        }
        if (hasAscii(bytes, 0, "CFU\0")) {
          return parseCodeBreaker(bytes, fileName);
        }
        if (hasAscii(bytes, 4, "SharkPortSave")) {
          return parseXport(bytes, fileName);
        }
        if (looksLikeGci(bytes)) {
          return parseGameCubeGci(bytes, fileName);
        }
        if (bytes.length === CONSTANTS.XBOX_TOTAL_SIZE) {
          return parseXbox(bytes, fileName);
        }
        if (bytes.length === CONSTANTS.CORE_SIZE) {
          return parseRawCore(bytes, fileName);
        }
        return parseUnknown(bytes, fileName);
      }

      function extractCoreSave(container) {
        return container && container.core ? {
          bytes: copyBytes(container.core.bytes),
          offset: container.core.offset,
          length: container.core.length,
          byteOrder: container.core.byteOrder,
          valueEndian: container.core.valueEndian
        } : null;
      }

      function validateProfileName(value) {
        const text = String(value || "");
        if (text.length > CONSTANTS.PROFILE_NAME_MAX) {
          return { ok: false, message: "Profile name is limited to 11 ASCII characters." };
        }
        for (let i = 0; i < text.length; i += 1) {
          const code = text.charCodeAt(i);
          if (code < 32 || code > 126) {
            return { ok: false, message: "Profile name must use printable ASCII characters." };
          }
        }
        return { ok: true, message: "" };
      }

      function validateAsciiText(value, maxLength, fieldLabel) {
        const text = String(value || "");
        if (text.length > maxLength) {
          return { ok: false, message: fieldLabel + " is limited to " + maxLength + " ASCII characters." };
        }
        for (let i = 0; i < text.length; i += 1) {
          const code = text.charCodeAt(i);
          if (code < 32 || code > 126) {
            return { ok: false, message: fieldLabel + " must use printable ASCII characters." };
          }
        }
        return { ok: true, message: "" };
      }

      function writeAsciiZ(bytes, offset, length, value) {
        for (let i = 0; i < length; i += 1) {
          bytes[offset + i] = 0;
        }
        const text = String(value || "");
        const max = Math.min(length - 1, text.length);
        for (let i = 0; i < max; i += 1) {
          bytes[offset + i] = text.charCodeAt(i) & 0xff;
        }
      }

      function makeEditedCore(container, draft) {
        if (!container || !container.core) {
          return null;
        }
        const edited = copyBytes(container.core.bytes);
        if (draft && Object.prototype.hasOwnProperty.call(draft, "profileName")) {
          writeAsciiZ(edited, 0, CONSTANTS.PROFILE_FIELD_LEN, draft.profileName);
        }
        if (draft && Object.prototype.hasOwnProperty.call(draft, "currentRiderId")) {
          const riderId = parseIntegerDraft(draft.currentRiderId);
          if (Number.isInteger(riderId) && riderId >= 0 && riderId <= 255) {
            edited[CONSTANTS.CORE_TAIL_RIDER_OFFSET] = riderId & 0xff;
          }
        }
        if (supportsGameCubeGameplayFields(container) && draft) {
          const money = parseIntegerDraft(draft.gameCubeMoney);
          if (Number.isInteger(money) && money >= 0 && money <= 4294967295) {
            writeU32be(edited, CONSTANTS.GC_MONEY_OFFSET, money);
          }
          const totalMoney = parseIntegerDraft(draft.gameCubeTotalMoney);
          if (Number.isInteger(totalMoney) && totalMoney >= 0 && totalMoney <= 4294967295) {
            writeU32be(edited, CONSTANTS.GC_TOTAL_MONEY_OFFSET, totalMoney);
          }
          if (Array.isArray(draft.gameCubeStats)) {
            for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
              const row = draft.gameCubeStats[riderIndex] || {};
              const rowOffset = riderStatRowOffset(riderIndex);
              RIDER_STAT_FIELDS.forEach((field) => {
                const raw = parseStatRawDraft(row[field.id]);
                if (Number.isInteger(raw)) {
                  edited[rowOffset + field.byteIndex] = raw & 0xff;
                }
              });
            }
          }
          if (draft.gameCubeCollectibles) {
            GC_COLLECTIBLE_AREAS.forEach((area) => {
              writeCollectibleArea(edited, area, draft.gameCubeCollectibles[area.id]);
            });
          }
          if (draft.gameCubeEvents && Number.isInteger(draft.gameCubeEventRiderIndex)) {
            GC_EVENT_RECORDS.forEach((eventRecord) => {
              const parsed = parseGameCubeEventValueDraft(eventRecord, draft.gameCubeEvents[eventRecord.id]);
              if (Number.isInteger(parsed)) {
                writeGameCubeEventRecord(edited, draft.gameCubeEventRiderIndex, eventRecord, parsed >>> 0);
              }
            });
          }
        }
        if (container.kind === "gamecube-gci") {
          writeCoreChecksum(edited, container.core.valueEndian);
        }
        return edited;
      }

      function hasGameCubeGameplayChanges(container, draft) {
        if (!supportsGameCubeGameplayFields(container) || !draft) {
          return false;
        }
        if (parseIntegerDraft(draft.gameCubeMoney) !== readGameCubeMoney(container)) {
          return true;
        }
        if (parseIntegerDraft(draft.gameCubeTotalMoney) !== readGameCubeTotalMoney(container)) {
          return true;
        }
        if (Array.isArray(draft.gameCubeStats)) {
          for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
            const row = draft.gameCubeStats[riderIndex] || {};
            const rowOffset = riderStatRowOffset(riderIndex);
            for (let statIndex = 0; statIndex < RIDER_STAT_FIELDS.length; statIndex += 1) {
              const field = RIDER_STAT_FIELDS[statIndex];
              if (parseStatRawDraft(row[field.id]) !== byteAt(container.core.bytes, rowOffset + field.byteIndex)) {
                return true;
              }
            }
          }
        }
        if (draft.gameCubeCollectibles) {
          for (let areaIndex = 0; areaIndex < GC_COLLECTIBLE_AREAS.length; areaIndex += 1) {
            const area = GC_COLLECTIBLE_AREAS[areaIndex];
            const original = readCollectibleArea(container, area).slots;
            const slots = normalizeCollectibleSlots(draft.gameCubeCollectibles[area.id], area.total);
            for (let slotIndex = 0; slotIndex < area.total; slotIndex += 1) {
              if (slots[slotIndex] !== original[slotIndex]) {
                return true;
              }
            }
          }
        }
        if (draft.gameCubeEvents && Number.isInteger(draft.gameCubeEventRiderIndex)) {
          for (let eventIndex = 0; eventIndex < GC_EVENT_RECORDS.length; eventIndex += 1) {
            const eventRecord = GC_EVENT_RECORDS[eventIndex];
            const parsed = parseGameCubeEventValueDraft(eventRecord, draft.gameCubeEvents[eventRecord.id]);
            const original = readGameCubeEventRecord(container, draft.gameCubeEventRiderIndex, eventRecord).value;
            if (parsed !== original) {
              return true;
            }
          }
        }
        return false;
      }

      function hasCoreFieldChanges(container, draft) {
        if (!container || !container.core || !draft) {
          return false;
        }
        return draft.profileName !== container.profileName ||
          parseIntegerDraft(draft.currentRiderId) !== readCoreRiderId(container) ||
          hasGameCubeGameplayChanges(container, draft);
      }

      function hasGameCubeCommentChanges(container, draft) {
        return Boolean(container &&
          container.kind === "gamecube-gci" &&
          draft &&
          (draft.gameCubeCommentLine1 !== container.wrapper.commentLine1 ||
            draft.gameCubeCommentLine2 !== container.wrapper.commentLine2));
      }

      function validateDraft(container, draft) {
        const checks = [validateProfileName(draft.profileName)];
        if (container && container.core) {
          const riderId = parseIntegerDraft(draft.currentRiderId);
          if (!Number.isInteger(riderId) || riderId < 0 || riderId > 255) {
            checks.push({ ok: false, message: "Current Rider ID must be an integer from 0 to 255." });
          }
        }
        if (container && container.kind === "gamecube-gci") {
          checks.push(validateAsciiText(draft.gameCubeCommentLine1, CONSTANTS.GC_COMMENT_MAX, "GameCube comment line 1"));
          checks.push(validateAsciiText(draft.gameCubeCommentLine2, CONSTANTS.GC_COMMENT_MAX, "GameCube comment line 2"));
        }
        if (supportsGameCubeGameplayFields(container)) {
          const money = parseIntegerDraft(draft.gameCubeMoney);
          if (!Number.isInteger(money) || money < 0 || money > 4294967295) {
            checks.push({ ok: false, message: "Money must be an integer from 0 to 4294967295." });
          }
          const totalMoney = parseIntegerDraft(draft.gameCubeTotalMoney);
          if (!Number.isInteger(totalMoney) || totalMoney < 0 || totalMoney > 4294967295) {
            checks.push({ ok: false, message: "Total money earned must be an integer from 0 to 4294967295." });
          }
          if (!Array.isArray(draft.gameCubeStats)) {
            checks.push({ ok: false, message: "Rider stats are not initialized." });
          } else {
            for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
              const row = draft.gameCubeStats[riderIndex] || {};
              for (let statIndex = 0; statIndex < RIDER_STAT_FIELDS.length; statIndex += 1) {
                const field = RIDER_STAT_FIELDS[statIndex];
                if (!Number.isInteger(parseStatRawDraft(row[field.id]))) {
                  checks.push({
                    ok: false,
                    message: "Rider " + riderIndex + " " + field.label + " must be from 0.0 to 11.0 in 0.2 increments."
                  });
                }
              }
            }
          }
          if (!draft.gameCubeCollectibles) {
            checks.push({ ok: false, message: "GameCube collectibles are not initialized." });
          } else {
            for (let areaIndex = 0; areaIndex < GC_COLLECTIBLE_AREAS.length; areaIndex += 1) {
              const area = GC_COLLECTIBLE_AREAS[areaIndex];
              const slots = draft.gameCubeCollectibles[area.id];
              if (!Array.isArray(slots) || slots.length !== area.total) {
                checks.push({ ok: false, message: area.label + " collectibles are not initialized." });
                continue;
              }
              for (let slotIndex = 0; slotIndex < slots.length; slotIndex += 1) {
                if (typeof slots[slotIndex] !== "boolean") {
                  checks.push({ ok: false, message: area.label + " collectible slots must be checked or unchecked." });
                  break;
                }
              }
            }
          }
          if (!Number.isInteger(draft.gameCubeEventRiderIndex) ||
            draft.gameCubeEventRiderIndex < 0 ||
            draft.gameCubeEventRiderIndex >= CONSTANTS.RIDER_SLOT_COUNT) {
            checks.push({ ok: false, message: "Event record rider index is invalid." });
          }
          if (!draft.gameCubeEvents) {
            checks.push({ ok: false, message: "GameCube event records are not initialized." });
          } else {
            for (let eventIndex = 0; eventIndex < GC_EVENT_RECORDS.length; eventIndex += 1) {
              const eventRecord = GC_EVENT_RECORDS[eventIndex];
              const parsed = parseGameCubeEventValueDraft(eventRecord, draft.gameCubeEvents[eventRecord.id]);
              if (!Number.isInteger(parsed) || parsed < 0 || parsed > 4294967295) {
                checks.push({
                  ok: false,
                  message: eventRecord.label + " " + eventRecord.type + " must be a non-negative integer" +
                    (eventRecord.type === "time" ? " or mm:ss value." : ".")
                });
              } else if (eventRecord.type === "time" && parsed > CONSTANTS.GC_EVENT_TIME_MAX_SECONDS) {
                checks.push({
                  ok: false,
                  message: eventRecord.label + " time is too large."
                });
              }
            }
          }
        }
        return checks.find((check) => !check.ok) || { ok: true, message: "" };
      }

      function canExportEditedDraft(container, draft) {
        if (!container || !draft) {
          return false;
        }
        if (hasCoreFieldChanges(container, draft)) {
          return Boolean(container.canExportEdited);
        }
        if (hasGameCubeCommentChanges(container, draft)) {
          return Boolean(container.canExportMetadataEdited);
        }
        return Boolean(container.canExportEdited);
      }

      function writeContainer(container, editedCore, options) {
        const edited = options && options.edited;
        if (!edited) {
          return copyBytes(container.originalBytes);
        }
        const draft = options && options.draft ? options.draft : {};
        const coreChanged = hasCoreFieldChanges(container, draft);
        const gcCommentChanged = hasGameCubeCommentChanges(container, draft);
        if (coreChanged && !container.canExportEdited) {
          throw new Error(container.exportBlocker || "Edited export is disabled.");
        }
        if (coreChanged && (!editedCore || editedCore.length !== CONSTANTS.CORE_SIZE)) {
          throw new Error("Edited core payload has the wrong size.");
        }
        const output = copyBytes(container.originalBytes);
        if (container.kind === "raw-core") {
          return copyBytes(editedCore);
        }
        if (container.kind === "xbox-data" || container.kind === "ps2-xport") {
          output.set(editedCore, container.core.offset);
          return output;
        }
        if (container.kind === "gamecube-gci") {
          if (coreChanged) {
            writeCoreChecksum(editedCore, container.core.valueEndian);
            output.set(editedCore, container.core.offset);
          }
          if (gcCommentChanged) {
            writeAsciiZ(output, CONSTANTS.GC_HEADER_SIZE, CONSTANTS.GC_COMMENT_LINE_LEN, draft.gameCubeCommentLine1);
            writeAsciiZ(output, CONSTANTS.GC_HEADER_SIZE + 0x20, CONSTANTS.GC_COMMENT_LINE_LEN, draft.gameCubeCommentLine2);
          }
          return output;
        }
        throw new Error("Edited export is not implemented for this wrapper.");
      }

      function profilePatchPreview(container, draft) {
        if (!container || !container.core || !draft) {
          return [];
        }
        const rows = [];
        if (hasCoreFieldChanges(container, draft)) {
          const edited = makeEditedCore(container, draft);
          if (edited) {
            const original = container.core.bytes;
            const ranges = [
              [0, CONSTANTS.PROFILE_FIELD_LEN],
              [CONSTANTS.CORE_TAIL_RIDER_OFFSET, 1],
              [CONSTANTS.CORE_TAIL_VALUE_OFFSET, 4]
            ];
            if (supportsGameCubeGameplayFields(container)) {
              ranges.push([CONSTANTS.GC_MONEY_OFFSET, 4]);
              ranges.push([CONSTANTS.GC_TOTAL_MONEY_OFFSET, 4]);
              for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
                ranges.push([riderStatRowOffset(riderIndex), RIDER_STAT_FIELDS.length]);
              }
              GC_COLLECTIBLE_AREAS.forEach((area) => {
                ranges.push([collectibleEntryOffset(area), CONSTANTS.GC_COLLECTIBLE_ENTRY_SIZE]);
              });
              if (Number.isInteger(draft.gameCubeEventRiderIndex)) {
                GC_EVENT_RECORDS.forEach((eventRecord) => {
                  ranges.push([eventRecordOffset(draft.gameCubeEventRiderIndex, eventRecord), CONSTANTS.GC_EVENT_RECORD_SIZE]);
                });
              }
            }
            ranges.forEach((range) => {
              const start = range[0];
              const length = range[1];
              const max = Math.min(start + length, original.length, edited.length);
              for (let i = start; i < max; i += 1) {
                if (original[i] !== edited[i]) {
                  rows.push({
                    scope: corePatchScope(i),
                    offset: container.core.offset + i,
                    oldValue: original[i],
                    newValue: edited[i]
                  });
                }
              }
            });
          }
        }
        if (container.kind === "gamecube-gci") {
          if (container.wrapper.commentLine1 !== draft.gameCubeCommentLine1) {
            rows.push({
              scope: "gci comment line 1",
              offset: CONSTANTS.GC_HEADER_SIZE,
              oldValue: container.wrapper.commentLine1,
              newValue: draft.gameCubeCommentLine1
            });
          }
          if (container.wrapper.commentLine2 !== draft.gameCubeCommentLine2) {
            rows.push({
              scope: "gci comment line 2",
              offset: CONSTANTS.GC_HEADER_SIZE + 0x20,
              oldValue: container.wrapper.commentLine2,
              newValue: draft.gameCubeCommentLine2
            });
          }
        }
        return rows;
      }

      function corePatchScope(coreOffset) {
        if (coreOffset < CONSTANTS.PROFILE_FIELD_LEN) {
          return "core profile";
        }
        if (coreOffset >= CONSTANTS.GC_MONEY_OFFSET && coreOffset < CONSTANTS.GC_MONEY_OFFSET + 4) {
          return "money";
        }
        if (coreOffset >= CONSTANTS.GC_TOTAL_MONEY_OFFSET && coreOffset < CONSTANTS.GC_TOTAL_MONEY_OFFSET + 4) {
          return "total money earned";
        }
        for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
          const rowOffset = riderStatRowOffset(riderIndex);
          if (coreOffset >= rowOffset && coreOffset < rowOffset + RIDER_STAT_FIELDS.length) {
            return "rider " + riderIndex + " stats";
          }
        }
        for (let areaIndex = 0; areaIndex < GC_COLLECTIBLE_AREAS.length; areaIndex += 1) {
          const area = GC_COLLECTIBLE_AREAS[areaIndex];
          const offset = collectibleEntryOffset(area);
          if (coreOffset >= offset && coreOffset < offset + CONSTANTS.GC_COLLECTIBLE_ENTRY_SIZE) {
            return area.label + " collectibles";
          }
        }
        for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
          for (let eventIndex = 0; eventIndex < GC_EVENT_RECORDS.length; eventIndex += 1) {
            const eventRecord = GC_EVENT_RECORDS[eventIndex];
            const offset = eventRecordOffset(riderIndex, eventRecord);
            if (coreOffset >= offset && coreOffset < offset + CONSTANTS.GC_EVENT_RECORD_SIZE) {
              return "rider " + riderIndex + " " + eventRecord.label + " " + eventRecord.type;
            }
          }
        }
        if (coreOffset >= CONSTANTS.CORE_TAIL_RIDER_OFFSET && coreOffset < CONSTANTS.CORE_TAIL_VALUE_OFFSET + 4) {
          return "core tail";
        }
        return "core";
      }

      function coreDiagnostics(container) {
        if (!container || !container.core) {
          return null;
        }
        const core = container.core.bytes;
        const markerPositions = findAsciiAll(core, "7777777");
        const riderSlots = [];
        for (let i = 0; i < CONSTANTS.RIDER_SLOT_COUNT; i += 1) {
          const offset = CONSTANTS.RIDER_SLOT_MARKER_OFFSET + (i * CONSTANTS.RIDER_SLOT_STRIDE);
          if (offset >= core.length) {
            continue;
          }
          riderSlots.push({
            index: i,
            markerOffset: offset,
            markerAbsoluteOffset: container.core.offset + offset,
            markerText: asciiZ(core, offset, 16),
            markerHex: bytesToHex(core.slice(offset, Math.min(core.length, offset + 16)), 16),
            stats: supportsGameCubeGameplayFields(container) ? readRiderStats(container, i) : null
          });
        }
        const diagnostics = {
          profileName: asciiZ(core, 0, CONSTANTS.PROFILE_FIELD_LEN),
          profileBytesHex: bytesToHex(core.slice(0, CONSTANTS.PROFILE_FIELD_LEN), CONSTANTS.PROFILE_FIELD_LEN),
          currentRiderId: readCoreRiderId(container),
          tailValue: readCoreTailValue(container),
          tailValueEndian: container.core.valueEndian,
          coreChecksum: {
            stored: readCoreTailValue(container) & 0xffff,
            calculated: ssxCoreChecksum(core),
            ok: (readCoreTailValue(container) & 0xffff) === ssxCoreChecksum(core)
          },
          tailBytesHex: bytesToHex(core.slice(CONSTANTS.CORE_TAIL_RIDER_OFFSET, CONSTANTS.CORE_TAIL_RIDER_OFFSET + 5), 5),
          coreLength: core.length,
          nonZeroBytes: countNonZero(core),
          marker7777777Positions: markerPositions,
          riderSlotStride: CONSTANTS.RIDER_SLOT_STRIDE,
          riderSlots,
          tail64Hex: bytesToHex(core.slice(Math.max(0, core.length - 64)), 64)
        };
        if (container.kind === "gamecube-gci") {
          diagnostics.gameCube = {
            commentLine1: container.wrapper.commentLine1,
            commentLine2: container.wrapper.commentLine2,
            money: readGameCubeMoney(container),
            totalMoneyEarned: readGameCubeTotalMoney(container),
            collectibles: readAllCollectibleAreas(container),
            collectibleEntries: readRawCollectibleEntries(container),
            eventRiderIndex: currentGameCubeEventRiderIndex(container),
            eventRecords: readAllGameCubeEventRecords(container, currentGameCubeEventRiderIndex(container)),
            preCoreIntegrityOffset: container.wrapper.preCoreIntegrityOffset,
            preCoreIntegrityHex: container.wrapper.preCoreIntegrityHex,
            trailingIntegrityHex: bytesToHex(core.slice(Math.max(0, core.length - 8)), 8),
            flagWordRegion: {
              coreOffset: 0x124,
              rawHex: bytesToHex(core.slice(0x124, 0x144), 32),
              byteBitReversedHex: bytesToHex(bitReverseBytes(core.slice(0x124, 0x144)), 32)
            },
            tableRegion: {
              coreOffset: 0x29c,
              rawHex: bytesToHex(core.slice(0x29c, 0x2bc), 32),
              swapped16Hex: bytesToHex(swap16Bytes(core.slice(0x29c, 0x2bc)), 32)
            }
          };
        }
        if (container.kind === "ps2-xport" && container.wrapper.checksum) {
          diagnostics.xport = container.wrapper.checksum;
        }
        return diagnostics;
      }

      const Core = Object.freeze({
        constants: CONSTANTS,
        detectContainer,
        extractCoreSave,
        writeContainer,
        makeEditedCore,
        validateProfileName,
        validateDraft,
        canExportEditedDraft,
        coreDiagnostics,
        ssxCoreChecksum,
        writeCoreChecksum,
        readCoreRiderId,
        readCoreTailValue,
        readGameCubeMoney,
        readGameCubeTotalMoney,
        readRiderStats,
        readAllCollectibleAreas,
        readRawCollectibleEntries,
        readAllGameCubeEventRecords,
        fieldRegistry: FIELD_REGISTRY,
        bytesToHex
      });

      const root = typeof window !== "undefined" ? window : globalThis;
      root.SSX3EditorCore = Core;

      if (typeof document === "undefined") {
        return;
      }

      const state = {
        file: null,
        bytes: null,
        container: null,
        draft: {
          profileName: "",
          currentRiderId: "",
          tailValue: "",
          gameCubeMoney: "",
          gameCubeTotalMoney: "",
          gameCubeStats: emptyRiderStatsDraft(),
          gameCubeCollectibles: emptyGameCubeCollectiblesDraft(),
          gameCubeEventRiderIndex: 0,
          gameCubeEvents: emptyGameCubeEventsDraft(),
          gameCubeCommentLine1: "",
          gameCubeCommentLine2: ""
        },
        activeTab: "editor"
      };

      const els = {};

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatBytes(length) {
        return length.toLocaleString("en-US") + " bytes";
      }

      function supportBadge(container) {
        if (!container) {
          return '<span class="badge">Waiting</span>';
        }
        if (container.support === "core") {
          return '<span class="badge good">Core parsed</span>';
        }
        if (container.kind === "unknown") {
          return '<span class="badge bad">Unknown</span>';
        }
        return '<span class="badge warn">Metadata only</span>';
      }

      function exportBadge(container, dirty) {
        if (!container) {
          return '<span class="badge">No export</span>';
        }
        if (!dirty) {
          return '<span class="badge good">Unchanged export</span>';
        }
        if (canExportEditedDraft(container, state.draft)) {
          return '<span class="badge good">Edited export</span>';
        }
        return '<span class="badge warn">Edited export blocked</span>';
      }

      function integrityStatusText(container) {
        if (!container || !container.core) {
          return "N/A";
        }
        if (container.kind === "gamecube-gci" && container.core.integrity) {
          return container.core.integrity.ok
            ? "CRC OK; edited export recalculates it"
            : "CRC mismatch in source file";
        }
        return "Unresolved; edited wrapped export disabled";
      }

      function fieldRows(rows) {
        return '<dl class="summary-list">' + rows.map((row) => {
          return '<dt>' + escapeHtml(row[0]) + '</dt><dd>' + escapeHtml(row[1]) + '</dd>';
        }).join("") + '</dl>';
      }

      function currentDirty() {
        return Boolean(state.container && (
          hasCoreFieldChanges(state.container, state.draft) ||
          hasGameCubeCommentChanges(state.container, state.draft)
        ));
      }

      function currentProfileValidation() {
        return validateDraft(state.container, state.draft);
      }

      function renderStatus() {
        const dirty = currentDirty();
        const container = state.container;
        const badges = [
          supportBadge(container),
          exportBadge(container, dirty)
        ];
        if (container && container.region && container.region !== "Unknown") {
          badges.push('<span class="badge">' + escapeHtml(container.region) + '</span>');
        }
        if (container && container.kind === "gamecube-gci" && container.core && container.core.integrity) {
          badges.push(container.core.integrity.ok
            ? '<span class="badge good">Checksum OK</span>'
            : '<span class="badge bad">Checksum mismatch</span>');
        }
        if (dirty) {
          badges.push('<span class="badge warn">Dirty</span>');
        }
        els.statusPanel.innerHTML = '<div class="status-row">' + badges.join("") + '</div>';
      }

      function renderSummary() {
        const container = state.container;
        if (!container) {
          els.summaryPanel.innerHTML = '<div class="empty">No save file selected.</div>';
          return;
        }
        const rows = [
          ["File", container.fileName || "Untitled"],
          ["Size", formatBytes(container.fileSize)],
          ["Format", container.label],
          ["Platform", container.platform],
          ["Region", container.region],
          ["Title ID", container.titleId || "Unknown"],
          ["Save Title", container.saveTitle || "Unknown"]
        ];
        if (container.core) {
          rows.push(["Core Offset", hexValue(container.core.offset, 0)]);
          rows.push(["Core Length", hexValue(container.core.length, 0) + " / " + container.core.length]);
        }
        if (container.kind === "gamecube-gci") {
          rows.push(["Money", readGameCubeMoney(container).toLocaleString("en-US")]);
          if (container.core && container.core.integrity) {
            rows.push([
              "Core Checksum",
              hexValue(container.core.integrity.stored, 4) + " / " + (container.core.integrity.ok ? "OK" : "Mismatch")
            ]);
          }
          rows.push(["GC Comment 1", container.wrapper.commentLine1 || "Blank"]);
          rows.push(["GC Comment 2", container.wrapper.commentLine2 || "Blank"]);
        }
        els.summaryPanel.innerHTML = fieldRows(rows);
      }

      function renderEditor() {
        const container = state.container;
        if (!container) {
          els.editorTab.innerHTML = '<div class="empty">No parsed save data.</div>';
          return;
        }
        if (!container.core) {
          els.editorTab.innerHTML =
            '<div class="field-grid">' +
              readonlyField("Detected Format", container.label) +
              readonlyField("Title ID", container.titleId || "Unknown") +
              readonlyField("Save Title", container.saveTitle || "Unknown") +
              readonlyField("Export Status", container.exportBlocker) +
            '</div>' +
            '<p class="note warn">This wrapper is detected, but the SSX 3 payload is not decoded in this version.</p>';
          return;
        }

        const validation = currentProfileValidation();
        const dirty = currentDirty();
        const exportReady = canExportEditedDraft(container, state.draft);
        const patchRows = profilePatchPreview(container, state.draft);
        const patchTable = patchRows.length ? renderPatchTable(patchRows) : "";
        const noteClass = validation.ok ? (dirty && !exportReady ? "warn" : "") : "bad";
        let note = "No field changes.";
        if (!validation.ok) {
          note = validation.message;
        } else if (dirty && exportReady) {
          note = hasCoreFieldChanges(container, state.draft)
            ? "Edited GameCube export is available. The SSX 3 core checksum will be recalculated."
            : "Edited export is available for the current metadata-only changes.";
        } else if (hasCoreFieldChanges(container, state.draft)) {
          note = container.exportBlocker + " Download Edited Core is raw analysis output until integrity bytes are mapped.";
        } else if (dirty) {
          note = container.exportBlocker;
        }
        const gameCubeFields = container.kind === "gamecube-gci"
          ? '<div class="field">' +
              '<label for="gameCubeCommentLine1Input">Memory Card Line 1</label>' +
              '<input id="gameCubeCommentLine1Input" type="text" maxlength="' + CONSTANTS.GC_COMMENT_MAX + '" value="' + escapeHtml(state.draft.gameCubeCommentLine1) + '">' +
            '</div>' +
            '<div class="field">' +
              '<label for="gameCubeCommentLine2Input">Memory Card Line 2</label>' +
              '<input id="gameCubeCommentLine2Input" type="text" maxlength="' + CONSTANTS.GC_COMMENT_MAX + '" value="' + escapeHtml(state.draft.gameCubeCommentLine2) + '">' +
            '</div>'
          : "";
        const coreTailFields =
          '<div class="field">' +
            '<label for="currentRiderIdInput">Current Rider ID</label>' +
            '<input id="currentRiderIdInput" type="text" inputmode="numeric" value="' + escapeHtml(state.draft.currentRiderId) + '">' +
          '</div>';
        const gameCubeGameplayFields = renderGameCubeGameplayEditor(container);

        els.editorTab.innerHTML =
          '<div class="field-grid">' +
            '<div class="field">' +
              '<label for="profileNameInput">In-game Profile Name</label>' +
              '<input id="profileNameInput" type="text" maxlength="' + CONSTANTS.PROFILE_NAME_MAX + '" value="' + escapeHtml(state.draft.profileName) + '">' +
            '</div>' +
            coreTailFields +
            gameCubeFields +
            readonlyField("Original Profile", container.profileName || "Blank") +
            readonlyField("Original Rider ID", readCoreRiderId(container)) +
            readonlyField("Tail Integrity Candidate", readCoreTailValue(container) + " (" + container.core.valueEndian + "-endian)") +
            readonlyField("Integrity Status", integrityStatusText(container)) +
            readonlyField("Platform", container.platform) +
            readonlyField("Region", container.region) +
            readonlyField("Core Offset", hexValue(container.core.offset, 0)) +
            readonlyField("Core Codec", container.core.byteOrder || "Unknown") +
          '</div>' +
          gameCubeGameplayFields +
          '<div class="footer-status">' +
            '<p class="note ' + noteClass + '">' + escapeHtml(note) + '</p>' +
          '</div>' +
          patchTable;
      }

      function renderGameCubeGameplayEditor(container) {
        if (!supportsGameCubeGameplayFields(container)) {
          return "";
        }
        const currentRider = readCoreRiderId(container);
        const draftStats = Array.isArray(state.draft.gameCubeStats) ? state.draft.gameCubeStats : emptyRiderStatsDraft();
        const draftCollectibles = state.draft.gameCubeCollectibles || emptyGameCubeCollectiblesDraft();
        const eventRiderIndex = Number.isInteger(state.draft.gameCubeEventRiderIndex)
          ? state.draft.gameCubeEventRiderIndex
          : currentGameCubeEventRiderIndex(container);
        const draftEvents = state.draft.gameCubeEvents || emptyGameCubeEventsDraft();
        const header = '<tr><th>Index</th>' + RIDER_STAT_FIELDS.map((field) => {
          return '<th>' + escapeHtml(field.label) + '</th>';
        }).join("") + '</tr>';
        const rows = [];
        for (let riderIndex = 0; riderIndex < CONSTANTS.RIDER_SLOT_COUNT; riderIndex += 1) {
          const row = draftStats[riderIndex] || {};
          rows.push(
            '<tr class="' + (riderIndex === currentRider ? "current-row" : "") + '">' +
              '<td class="mono">' + riderIndex + (riderIndex === currentRider ? " current" : "") + '</td>' +
              RIDER_STAT_FIELDS.map((field) => {
                const id = "gcStatInput-" + riderIndex + "-" + field.id;
                return '<td>' +
                  '<input id="' + id + '" type="text" inputmode="decimal" data-gc-stat-index="' + riderIndex + '" data-gc-stat-id="' + field.id + '" value="' + escapeHtml(row[field.id]) + '">' +
                '</td>';
              }).join("") +
            '</tr>'
          );
        }
        const eventRows = GC_EVENT_RECORDS.map((eventRecord) => {
          const original = readGameCubeEventRecord(container, eventRiderIndex, eventRecord);
          const id = "gcEventInput-" + eventRecord.id;
          return '<tr class="' + (eventRecord.confidence === "candidate" ? "candidate" : "") + '">' +
            '<td>' + escapeHtml(eventRecord.peak) + '</td>' +
            '<td>' + escapeHtml(eventRecord.category) + '</td>' +
            '<td>' + escapeHtml(eventRecord.label) + '</td>' +
            '<td>' +
              '<input id="' + id + '" type="text" inputmode="' + (eventRecord.type === "time" ? "numeric" : "numeric") + '" data-gc-event-id="' + escapeHtml(eventRecord.id) + '" value="' + escapeHtml(draftEvents[eventRecord.id]) + '">' +
            '</td>' +
            '<td>' + escapeHtml(original.displayValue) + '</td>' +
            '<td class="mono">' + escapeHtml(original.statusHex) + '</td>' +
            '<td>' + escapeHtml(eventRecord.confidence) + '</td>' +
          '</tr>';
        }).join("");
        const collectibleRows = GC_COLLECTIBLE_AREAS.map((area) => {
          const original = readCollectibleArea(container, area);
          const slots = normalizeCollectibleSlots(draftCollectibles[area.id], area.total);
          const checked = countCheckedSlots(slots);
          return '<tr>' +
            '<td>' + escapeHtml(area.peak) + '</td>' +
            '<td>' + escapeHtml(area.label) + '</td>' +
            '<td class="collectible-count">' + checked + " / " + area.total + '</td>' +
            '<td>' + renderCollectibleSlotGrid(area, slots) + '</td>' +
            '<td class="collectible-count">' + original.count + " / " + area.total + '</td>' +
          '</tr>';
        }).join("");
        return '<div class="editor-section">' +
          '<h2 class="section-title">GameCube Gameplay</h2>' +
          '<div class="field-grid">' +
            '<div class="field">' +
              '<label for="gameCubeMoneyInput">Money</label>' +
              '<input id="gameCubeMoneyInput" type="text" inputmode="numeric" value="' + escapeHtml(state.draft.gameCubeMoney) + '">' +
            '</div>' +
            '<div class="field">' +
              '<label for="gameCubeTotalMoneyInput">Total Money Earned</label>' +
              '<input id="gameCubeTotalMoneyInput" type="text" inputmode="numeric" value="' + escapeHtml(state.draft.gameCubeTotalMoney) + '">' +
            '</div>' +
            readonlyField("Original Money", readGameCubeMoney(container).toLocaleString("en-US")) +
            readonlyField("Original Total Money Earned", readGameCubeTotalMoney(container).toLocaleString("en-US")) +
          '</div>' +
          '<div class="table-wrap stats-table" style="margin-top: 14px;">' +
            '<table>' +
              '<thead>' + header + '</thead>' +
              '<tbody>' + rows.join("") + '</tbody>' +
            '</table>' +
          '</div>' +
          '<h2 class="section-title" style="margin-top: 16px;">Rider ' + eventRiderIndex + ' Event Records</h2>' +
          '<div class="table-wrap event-table">' +
            '<table>' +
              '<thead><tr><th>Peak</th><th>Type</th><th>Event</th><th>Value</th><th>Original</th><th>Status</th><th>Map</th></tr></thead>' +
              '<tbody>' + eventRows + '</tbody>' +
            '</table>' +
          '</div>' +
          '<h2 class="section-title" style="margin-top: 16px;">GameCube Collectibles</h2>' +
          '<div class="table-wrap collectible-table">' +
            '<table>' +
              '<thead><tr><th>Peak</th><th>Area</th><th>Count</th><th>Slots</th><th>Original</th></tr></thead>' +
              '<tbody>' + collectibleRows + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
      }

      function renderCollectibleSlotGrid(area, slots) {
        const inputs = [];
        for (let slotIndex = 0; slotIndex < area.total; slotIndex += 1) {
          const id = "gcCollectible-" + area.id + "-" + slotIndex;
          inputs.push(
            '<label class="slot-toggle">' +
              '<input id="' + id + '" type="checkbox" data-gc-collectible-area="' + escapeHtml(area.id) + '" data-gc-collectible-slot="' + slotIndex + '"' + (slots[slotIndex] ? " checked" : "") + '>' +
              '<span>' + (slotIndex + 1) + '</span>' +
            '</label>'
          );
        }
        return '<div class="slot-grid">' + inputs.join("") + '</div>';
      }

      function readonlyField(label, value) {
        return '<div class="field"><div class="label">' + escapeHtml(label) + '</div><div class="field-value">' + escapeHtml(value) + '</div></div>';
      }

      function renderPatchTable(rows) {
        return '<div class="changed">' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Scope</th><th>Offset</th><th>Old</th><th>New</th></tr></thead>' +
              '<tbody>' + rows.map((row) => {
                const oldValue = typeof row.oldValue === "number" ? hexValue(row.oldValue, 2) : row.oldValue;
                const newValue = typeof row.newValue === "number" ? hexValue(row.newValue, 2) : row.newValue;
                return '<tr>' +
                  '<td>' + escapeHtml(row.scope) + '</td>' +
                  '<td class="mono">' + escapeHtml(hexValue(row.offset, 0)) + '</td>' +
                  '<td class="mono">' + escapeHtml(oldValue) + '</td>' +
                  '<td class="mono">' + escapeHtml(newValue) + '</td>' +
                '</tr>';
              }).join("") + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
      }

      function renderDiagnostics() {
        const container = state.container;
        const diagnostics = coreDiagnostics(container);
        if (!diagnostics) {
          els.diagnosticsTab.innerHTML = '<div class="empty">No diagnostics available.</div>';
          return;
        }
        const markerText = diagnostics.marker7777777Positions.length
          ? diagnostics.marker7777777Positions.map((offset) => hexValue(offset, 0)).join(", ")
          : "None";
        const summaryRows = [
          ["Profile Bytes", diagnostics.profileBytesHex],
          ["Core Tail Bytes", diagnostics.tailBytesHex],
          ["Current Rider ID", diagnostics.currentRiderId],
          ["Tail Value", diagnostics.tailValue + " (" + diagnostics.tailValueEndian + "-endian)"],
          ["Core CRC Candidate", "stored " + hexValue(diagnostics.coreChecksum.stored, 4) + ", calculated " + hexValue(diagnostics.coreChecksum.calculated, 4)],
          ["Core CRC Status", diagnostics.coreChecksum.ok ? "OK" : "Mismatch"],
          ["GameCube Money", diagnostics.gameCube ? diagnostics.gameCube.money : "N/A"],
          ["GameCube Total Money Earned", diagnostics.gameCube ? diagnostics.gameCube.totalMoneyEarned : "N/A"],
          ["Non-zero Core Bytes", diagnostics.nonZeroBytes + " / " + diagnostics.coreLength],
          ["7777777 Markers", markerText],
          ["Rider Slot Stride", hexValue(diagnostics.riderSlotStride, 0)]
        ];
        if (diagnostics.xport) {
          summaryRows.push(
            ["XPort Payload Start", hexValue(diagnostics.xport.payloadStart, 0)],
            ["XPort Checksum Offset", hexValue(diagnostics.xport.checksumOffset, 0)],
            ["XPort Checksum", "stored " + hexValue(diagnostics.xport.stored, 8) + ", calculated " + hexValue(diagnostics.xport.calculated, 8)],
            ["XPort Checksum Status", diagnostics.xport.ok ? "OK" : "Mismatch"]
          );
        }
        const summary = fieldRows(summaryRows);
        const gameCubeCodec = diagnostics.gameCube
          ? '<div class="table-wrap" style="margin-top: 14px;">' +
              '<table>' +
                '<thead><tr><th>GameCube Area</th><th>Offset</th><th>Raw</th><th>Decoded View</th></tr></thead>' +
                '<tbody>' +
                  '<tr><td>Pre-core integrity</td><td class="mono">' + hexValue(diagnostics.gameCube.preCoreIntegrityOffset, 0) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.preCoreIntegrityHex) + '</td><td>read-only</td></tr>' +
                  '<tr><td>Tail integrity</td><td class="mono">' + hexValue(CONSTANTS.CORE_TAIL_VALUE_OFFSET, 0) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.trailingIntegrityHex) + '</td><td>CRC-16 recalculated on export</td></tr>' +
                  '<tr><td>Bit-reversed flags</td><td class="mono">' + hexValue(diagnostics.gameCube.flagWordRegion.coreOffset, 0) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.flagWordRegion.rawHex) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.flagWordRegion.byteBitReversedHex) + '</td></tr>' +
                  '<tr><td>16-bit tables</td><td class="mono">' + hexValue(diagnostics.gameCube.tableRegion.coreOffset, 0) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.tableRegion.rawHex) + '</td><td class="mono">' + escapeHtml(diagnostics.gameCube.tableRegion.swapped16Hex) + '</td></tr>' +
                '</tbody>' +
              '</table>' +
            '</div>'
          : "";
        const collectibleTable = diagnostics.gameCube
          ? '<div class="table-wrap" style="margin-top: 14px;">' +
              '<table>' +
                '<thead><tr><th>Peak</th><th>Area</th><th>Core Offset</th><th>Count</th><th>Mask</th></tr></thead>' +
                '<tbody>' + diagnostics.gameCube.collectibles.map((area) => {
                  return '<tr>' +
                    '<td>' + escapeHtml(area.peak) + '</td>' +
                    '<td>' + escapeHtml(area.label) + '</td>' +
                    '<td class="mono">' + hexValue(area.offset, 0) + '</td>' +
                    '<td>' + area.count + ' / ' + area.total + ' (slots ' + area.slotCount + ', mask bits ' + area.maskPopcount + ')</td>' +
                    '<td class="mono">' + escapeHtml(area.maskHex) + '</td>' +
                  '</tr>';
                }).join("") + '</tbody>' +
              '</table>' +
            '</div>'
          : "";
        const eventTable = diagnostics.gameCube
          ? '<div class="table-wrap" style="margin-top: 14px;">' +
              '<table>' +
                '<thead><tr><th>Rider</th><th>Peak</th><th>Event</th><th>Core Offset</th><th>Value</th><th>Status</th><th>Map</th></tr></thead>' +
                '<tbody>' + diagnostics.gameCube.eventRecords.map((record) => {
                  return '<tr>' +
                    '<td>' + record.riderIndex + '</td>' +
                    '<td>' + escapeHtml(record.peak) + '</td>' +
                    '<td>' + escapeHtml(record.label) + '</td>' +
                    '<td class="mono">' + hexValue(record.offset, 0) + '</td>' +
                    '<td>' + escapeHtml(record.displayValue) + '</td>' +
                    '<td class="mono">' + escapeHtml(record.statusHex) + '</td>' +
                    '<td>' + escapeHtml(record.confidence) + '</td>' +
                  '</tr>';
                }).join("") + '</tbody>' +
              '</table>' +
            '</div>'
          : "";
        const slotTable =
          '<div class="table-wrap" style="margin-top: 14px;">' +
            '<table>' +
              '<thead><tr><th>Index</th><th>Core Offset</th><th>Absolute Offset</th><th>Stats</th><th>Marker Bytes</th></tr></thead>' +
              '<tbody>' + diagnostics.riderSlots.map((slot) => {
                const statText = slot.stats
                  ? RIDER_STAT_FIELDS.map((field) => field.label + " " + formatStatValue(slot.stats[field.id])).join(", ")
                  : slot.markerText || "Blank";
                return '<tr>' +
                  '<td>' + slot.index + '</td>' +
                  '<td class="mono">' + hexValue(slot.markerOffset, 0) + '</td>' +
                  '<td class="mono">' + hexValue(slot.markerAbsoluteOffset, 0) + '</td>' +
                  '<td>' + escapeHtml(statText) + '</td>' +
                  '<td class="mono">' + escapeHtml(slot.markerHex) + '</td>' +
                '</tr>';
              }).join("") + '</tbody>' +
            '</table>' +
          '</div>';
        els.diagnosticsTab.innerHTML = summary + gameCubeCodec + collectibleTable + eventTable + slotTable;
      }

      function technicalReport() {
        if (!state.container) {
          return {};
        }
        const container = state.container;
        return {
          fileName: container.fileName,
          fileSize: container.fileSize,
          detectedFormat: container.label,
          kind: container.kind,
          platform: container.platform,
          region: container.region,
          titleId: container.titleId,
          saveTitle: container.saveTitle,
          support: container.support,
          canEditFields: container.canEditFields,
          canExportEdited: container.canExportEdited,
          canExportMetadataEdited: Boolean(container.canExportMetadataEdited),
          exportBlocker: container.exportBlocker,
          profileName: container.profileName,
          core: container.core ? {
            offset: container.core.offset,
            fileDataOffset: container.core.fileDataOffset,
            length: container.core.length,
            byteOrder: container.core.byteOrder,
            first32Hex: bytesToHex(container.core.bytes.slice(0, 32), 32),
            last32Hex: bytesToHex(container.core.bytes.slice(Math.max(0, container.core.bytes.length - 32)), 32),
            currentRiderId: readCoreRiderId(container),
            tailValue: readCoreTailValue(container),
            tailValueEndian: container.core.valueEndian,
            gameCubeMoney: supportsGameCubeGameplayFields(container) ? readGameCubeMoney(container) : null,
            gameCubeTotalMoney: supportsGameCubeGameplayFields(container) ? readGameCubeTotalMoney(container) : null,
            riderStats: supportsGameCubeGameplayFields(container) ? readAllRiderStats(container) : null,
            gameCubeCollectibles: supportsGameCubeGameplayFields(container) ? readAllCollectibleAreas(container) : null,
            gameCubeEventRecords: supportsGameCubeGameplayFields(container)
              ? readAllGameCubeEventRecords(container, currentGameCubeEventRiderIndex(container))
              : null
          } : null,
          wrapper: container.wrapper,
          records: container.records.map((record) => ({
            name: record.name,
            offset: record.offset,
            size: record.size,
            dataOffset: record.dataOffset,
            dataEnd: record.dataEnd,
            modeOrType: record.modeOrType
          })),
          diagnostics: coreDiagnostics(container),
          warnings: container.warnings
        };
      }

      function renderTechnical() {
        els.technicalTab.innerHTML = '<pre>' + escapeHtml(JSON.stringify(technicalReport(), null, 2)) + '</pre>';
      }

      function renderTabs() {
        els.tabs.forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.tab === state.activeTab);
        });
        els.tabContents.forEach((section) => {
          section.classList.toggle("active", section.id === "tab-" + state.activeTab);
        });
      }

      function renderActions() {
        const container = state.container;
        const dirty = currentDirty();
        const coreChanged = hasCoreFieldChanges(container, state.draft);
        const validation = currentProfileValidation();
        const exportReady = canExportEditedDraft(container, state.draft);
        els.loadedName.textContent = container ? (container.fileName || "Loaded save") : "No file loaded";
        els.downloadOriginal.disabled = !container;
        els.downloadCore.disabled = !container || !container.core;
        els.downloadEditedCore.disabled = !container || !container.core || !coreChanged || !validation.ok;
        els.downloadEditedCore.title = container && container.core
          ? (container.kind === "gamecube-gci"
            ? "Downloads the raw 0x9b61 SSX 3 payload with recalculated core checksum, without the GameCube GCI wrapper."
            : "Downloads a raw 0x9b61 SSX 3 payload for analysis. This is not a console-ready save until integrity bytes are mapped.")
          : "";
        els.resetEdits.disabled = !container || !dirty;
        els.downloadEdited.disabled = !container || !dirty || !validation.ok || !exportReady;
        els.downloadEdited.title = container && dirty && !exportReady ? container.exportBlocker : "";
      }

      function render() {
        renderTabs();
        renderStatus();
        renderSummary();
        renderEditor();
        renderDiagnostics();
        renderTechnical();
        renderActions();
      }

      async function loadFile(file) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const container = detectContainer(bytes, file.name);
        state.file = file;
        state.bytes = bytes;
        state.container = container;
        state.draft.profileName = container.profileName || "";
        state.draft.currentRiderId = container.core ? String(readCoreRiderId(container)) : "";
        state.draft.tailValue = container.core ? String(readCoreTailValue(container)) : "";
        state.draft.gameCubeMoney = supportsGameCubeGameplayFields(container) ? String(readGameCubeMoney(container)) : "";
        state.draft.gameCubeTotalMoney = supportsGameCubeGameplayFields(container) ? String(readGameCubeTotalMoney(container)) : "";
        state.draft.gameCubeStats = gameCubeStatsDraft(container);
        state.draft.gameCubeCollectibles = gameCubeCollectiblesDraft(container);
        state.draft.gameCubeEventRiderIndex = supportsGameCubeGameplayFields(container) ? currentGameCubeEventRiderIndex(container) : 0;
        state.draft.gameCubeEvents = gameCubeEventsDraft(container, state.draft.gameCubeEventRiderIndex);
        state.draft.gameCubeCommentLine1 = container.kind === "gamecube-gci" ? container.wrapper.commentLine1 || "" : "";
        state.draft.gameCubeCommentLine2 = container.kind === "gamecube-gci" ? container.wrapper.commentLine2 || "" : "";
        render();
      }

      function downloadBytes(bytes, fileName) {
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function downloadOriginal() {
        if (!state.container) {
          return;
        }
        const bytes = writeContainer(state.container, null, { edited: false });
        downloadBytes(bytes, addFileSuffix(state.container.fileName || "save.bin", ".unchanged"));
      }

      function downloadCore() {
        if (!state.container || !state.container.core) {
          return;
        }
        downloadBytes(state.container.core.bytes, coreFileName(state.container.fileName, false));
      }

      function downloadEditedCore() {
        if (!state.container || !state.container.core) {
          return;
        }
        const validation = currentProfileValidation();
        if (!validation.ok) {
          return;
        }
        const editedCore = makeEditedCore(state.container, state.draft);
        downloadBytes(editedCore, coreFileName(state.container.fileName, true));
      }

      function downloadEdited() {
        if (!state.container || !state.container.core) {
          return;
        }
        const validation = currentProfileValidation();
        if (!validation.ok) {
          return;
        }
        const editedCore = makeEditedCore(state.container, state.draft);
        const bytes = writeContainer(state.container, editedCore, { edited: true, draft: state.draft });
        downloadBytes(bytes, addFileSuffix(state.container.fileName || "save.bin", ".edited"));
      }

      function resetEdits() {
        if (!state.container) {
          return;
        }
        state.draft.profileName = state.container.profileName || "";
        state.draft.currentRiderId = state.container.core ? String(readCoreRiderId(state.container)) : "";
        state.draft.tailValue = state.container.core ? String(readCoreTailValue(state.container)) : "";
        state.draft.gameCubeMoney = supportsGameCubeGameplayFields(state.container) ? String(readGameCubeMoney(state.container)) : "";
        state.draft.gameCubeTotalMoney = supportsGameCubeGameplayFields(state.container) ? String(readGameCubeTotalMoney(state.container)) : "";
        state.draft.gameCubeStats = gameCubeStatsDraft(state.container);
        state.draft.gameCubeCollectibles = gameCubeCollectiblesDraft(state.container);
        state.draft.gameCubeEventRiderIndex = supportsGameCubeGameplayFields(state.container) ? currentGameCubeEventRiderIndex(state.container) : 0;
        state.draft.gameCubeEvents = gameCubeEventsDraft(state.container, state.draft.gameCubeEventRiderIndex);
        state.draft.gameCubeCommentLine1 = state.container.kind === "gamecube-gci" ? state.container.wrapper.commentLine1 || "" : "";
        state.draft.gameCubeCommentLine2 = state.container.kind === "gamecube-gci" ? state.container.wrapper.commentLine2 || "" : "";
        render();
      }

      function bindEvents() {
        els.chooseFile.addEventListener("click", () => els.fileInput.click());
        els.fileInput.addEventListener("change", () => {
          const file = els.fileInput.files && els.fileInput.files[0];
          if (file) {
            loadFile(file).catch(showLoadError);
          }
        });
        els.dropzone.addEventListener("click", () => els.fileInput.click());
        els.dropzone.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            els.fileInput.click();
          }
        });
        els.dropzone.addEventListener("dragover", (event) => {
          event.preventDefault();
          els.dropzone.classList.add("dragging");
        });
        els.dropzone.addEventListener("dragleave", () => {
          els.dropzone.classList.remove("dragging");
        });
        els.dropzone.addEventListener("drop", (event) => {
          event.preventDefault();
          els.dropzone.classList.remove("dragging");
          const file = event.dataTransfer.files && event.dataTransfer.files[0];
          if (file) {
            loadFile(file).catch(showLoadError);
          }
        });
        els.downloadOriginal.addEventListener("click", downloadOriginal);
        els.downloadCore.addEventListener("click", downloadCore);
        els.downloadEditedCore.addEventListener("click", downloadEditedCore);
        els.downloadEdited.addEventListener("click", () => {
          try {
            downloadEdited();
          } catch (error) {
            alert(error.message);
          }
        });
        els.resetEdits.addEventListener("click", resetEdits);
        els.tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            state.activeTab = tab.dataset.tab;
            renderTabs();
          });
        });
        document.addEventListener("input", (event) => {
          const target = event.target;
          if (!target) {
            return;
          }
          const inputId = target.id;
          if (inputId === "profileNameInput") {
            state.draft.profileName = target.value;
          } else if (inputId === "currentRiderIdInput") {
            state.draft.currentRiderId = target.value;
          } else if (inputId === "gameCubeMoneyInput") {
            state.draft.gameCubeMoney = target.value;
          } else if (inputId === "gameCubeTotalMoneyInput") {
            state.draft.gameCubeTotalMoney = target.value;
          } else if (target.dataset && target.dataset.gcStatIndex && target.dataset.gcStatId) {
            const riderIndex = Number.parseInt(target.dataset.gcStatIndex, 10);
            const statId = target.dataset.gcStatId;
            if (!Array.isArray(state.draft.gameCubeStats)) {
              state.draft.gameCubeStats = emptyRiderStatsDraft();
            }
            if (riderIndex >= 0 && riderIndex < CONSTANTS.RIDER_SLOT_COUNT) {
              state.draft.gameCubeStats[riderIndex][statId] = target.value;
            }
          } else if (target.dataset && target.dataset.gcEventId) {
            const eventId = target.dataset.gcEventId;
            const eventRecord = GC_EVENT_RECORDS.find((record) => record.id === eventId);
            if (!state.draft.gameCubeEvents) {
              state.draft.gameCubeEvents = emptyGameCubeEventsDraft();
            }
            if (eventRecord) {
              state.draft.gameCubeEvents[eventRecord.id] = target.value;
            }
          } else if (inputId === "gameCubeCommentLine1Input") {
            state.draft.gameCubeCommentLine1 = target.value;
          } else if (inputId === "gameCubeCommentLine2Input") {
            state.draft.gameCubeCommentLine2 = target.value;
          } else {
            return;
          }
          const cursor = target.selectionStart;
          const length = target.value.length;
          render();
          const input = document.getElementById(inputId);
          if (input) {
            input.focus();
            const position = cursor == null ? length : cursor;
            input.setSelectionRange(position, position);
          }
        });
        document.addEventListener("change", (event) => {
          const target = event.target;
          if (!target || !target.dataset || !target.dataset.gcCollectibleArea) {
            return;
          }
          const areaId = target.dataset.gcCollectibleArea;
          const slotIndex = Number.parseInt(target.dataset.gcCollectibleSlot, 10);
          const area = GC_COLLECTIBLE_AREAS.find((item) => item.id === areaId);
          if (!area || !Number.isInteger(slotIndex) || slotIndex < 0 || slotIndex >= area.total) {
            return;
          }
          if (!state.draft.gameCubeCollectibles) {
            state.draft.gameCubeCollectibles = emptyGameCubeCollectiblesDraft();
          }
          if (!Array.isArray(state.draft.gameCubeCollectibles[area.id])) {
            state.draft.gameCubeCollectibles[area.id] = Array.from({ length: area.total }, () => false);
          }
          state.draft.gameCubeCollectibles[area.id][slotIndex] = Boolean(target.checked);
          render();
          const input = document.getElementById(target.id);
          if (input) {
            input.focus();
          }
        });
      }

      function showLoadError(error) {
        state.file = null;
        state.bytes = null;
        state.container = null;
        state.draft.profileName = "";
        state.draft.currentRiderId = "";
        state.draft.tailValue = "";
        state.draft.gameCubeMoney = "";
        state.draft.gameCubeTotalMoney = "";
        state.draft.gameCubeStats = emptyRiderStatsDraft();
        state.draft.gameCubeCollectibles = emptyGameCubeCollectiblesDraft();
        state.draft.gameCubeEventRiderIndex = 0;
        state.draft.gameCubeEvents = emptyGameCubeEventsDraft();
        state.draft.gameCubeCommentLine1 = "";
        state.draft.gameCubeCommentLine2 = "";
        render();
        alert(error.message || String(error));
      }

      function collectElements() {
        els.loadedName = document.getElementById("loadedName");
        els.chooseFile = document.getElementById("chooseFile");
        els.fileInput = document.getElementById("fileInput");
        els.downloadOriginal = document.getElementById("downloadOriginal");
        els.downloadCore = document.getElementById("downloadCore");
        els.downloadEditedCore = document.getElementById("downloadEditedCore");
        els.downloadEdited = document.getElementById("downloadEdited");
        els.resetEdits = document.getElementById("resetEdits");
        els.dropzone = document.getElementById("dropzone");
        els.statusPanel = document.getElementById("statusPanel");
        els.summaryPanel = document.getElementById("summaryPanel");
        els.editorTab = document.getElementById("tab-editor");
        els.diagnosticsTab = document.getElementById("tab-diagnostics");
        els.technicalTab = document.getElementById("tab-technical");
        els.tabs = Array.from(document.querySelectorAll(".tab"));
        els.tabContents = Array.from(document.querySelectorAll(".tab-content"));
      }

      function init() {
        collectElements();
        bindEvents();
        render();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    }());
  </script>
</body>
</html>

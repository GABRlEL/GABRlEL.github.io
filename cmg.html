
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CMG Web</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a22; --text:#e9eef7; --sub:#a8b3c7; --accent:#5b9cff; --muted:#27314a; --good:#22c55e; --btn:#1e2635; --border:#263043;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}
  main{max-width:920px;margin:24px auto;padding:0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--sub)}
  select,button,textarea{border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}
  select,button{height:40px}
  button{cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-accent{background:linear-gradient(180deg,var(--accent),#357dff);border:0;color:white;font-weight:600}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .flagbox{display:flex;align-items:center;gap:12px}
  .flagbox img{width:56px;height:36px;border-radius:6px;border:1px solid var(--border);object-fit:cover;background:#0b0d12}
  textarea#code{width:100%;min-height:140px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Cascadia Mono",Consolas,monospace;font-size:13px}
  footer{opacity:.8;color:var(--sub);padding:16px 20px;text-align:center}
  a{color:#8db6ff;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>CMG Web</h1>
  <div class="row">
    <button id="helpBtn">Original</button>
    <button id="infoBtn">About</button>
  </div>
</header>
<main>
  <div class="card">
    <div class="grid">
      <div class="field" style="grid-column:span 12;">
        <label>Code:</label>
        <textarea id="code" readonly placeholder="Click Generate after choosing a country and a flag."></textarea>
      </div>

      <div class="field" style="grid-column:span 6;">
        <label>Region zone:</label>
        <select id="regionSelect">
          <option value="PAL" selected>PAL</option>
          <option value="NTSC-US">NTSC-US</option>
          <option value="NTSC-J">NTSC-J</option>
          <option value="NTSC-K">NTSC-K</option>
        </select>
      </div>

      <div class="field" style="grid-column:span 6;">
        <label>Flag:</label>
        <div class="row">
          <select id="flagSelect"><option value="">Select flag…</option></select>
          <div class="flagbox">
            <img id="flagImg" alt="Flag preview"/>
          </div>
        </div>
      </div>

      <div class="field" style="grid-column:span 12;">
        <label>Country:</label>
        <select id="countrySelect"><option value="">Select country…</option></select>
      </div>

      <div class="field" style="grid-column:span 12;">
        <button id="genBtn" class="btn-accent" disabled>Generate</button>
      </div>
    </div>
  </div>
</main>
<footer>
  Port based on the original Windows application by <a href="https://wiki.tockdom.com/wiki/User:Atlas" target="_blank" rel="noopener">Atlas</a>.
</footer>

const REGIONS = {"PAL": {"flagAddr": "0242ABD8", "regionAddr": "0042AB67", "regionVal": "00000002", "countryAddr": "0442BBDC"}, "NTSC-US": {"flagAddr": "02426858", "regionAddr": "004267E7", "regionVal": "00000001", "countryAddr": "0442785C"}, "NTSC-J": {"flagAddr": "0242A558", "regionAddr": "0042A4E7", "regionVal": "00000000", "countryAddr": "0442B55C"}, "NTSC-K": {"flagAddr": "02418BF8", "regionAddr": "00418B87", "regionVal": "00000005", "countryAddr": "04419BFC"}};

const countrySel = document.getElementById('countrySelect');
const flagSel = document.getElementById('flagSelect');
const regionSel = document.getElementById('regionSelect');
const genBtn = document.getElementById('genBtn');
const codeOut = document.getElementById('code');
const flagImg = document.getElementById('flagImg');
const helpBtn = document.getElementById('helpBtn');
const infoBtn = document.getElementById('infoBtn');

(function init(){
  COUNTRIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.code;
    opt.textContent = c.name;
    countrySel.appendChild(opt);
  });
  FLAGS.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.code;
    opt.textContent = f.name;
    opt.dataset.img = f.img ? "data:image/png;base64,"+f.img : "";
    flagSel.appendChild(opt);
  });
  updateGenerateState();
})();

function updateGenerateState(){
  genBtn.disabled = !(countrySel.value && flagSel.value);
}

flagSel.addEventListener('change', () => {
  const opt = flagSel.selectedOptions[0];
  const data = opt ? opt.dataset.img : "";
  if (data) {
    flagImg.src = data;
    flagImg.style.visibility = 'visible';
  } else {
    flagImg.removeAttribute('src');
    flagImg.style.visibility = 'hidden';
  }
  updateGenerateState();
});

countrySel.addEventListener('change', updateGenerateState);

genBtn.addEventListener('click', () => {
  const region = regionSel.value;
  const conf = REGIONS[region];
  const flag = flagSel.value;
  const country = countrySel.value;
  if (!conf || !flag || !country) return;
  const lines = [
    `${conf.flagAddr} 0000${flag}`,
    `${conf.regionAddr} ${conf.regionVal}`,
    `${conf.countryAddr} ${country}`
  ];
  codeOut.value = lines.join("\n");
});

helpBtn.addEventListener('click', () => {
  window.open("https://wiki.tockdom.com/wiki/MKWii_Country_Modifier_Generator", "_blank", "noopener");
});
infoBtn.addEventListener('click', () => {
  alert("This program allows you to create country modifier codes for Mario Kart Wii.\n\nThis tool wouldn't have been possible without Atlas.");
});
</script>
